name: Security Scan

on:
  push: # Trigger on pushes to any branch
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    uses: khangvum/workflows/.github/workflows/gitleaks.yml@main
    secrets: inherit

  dependency-audit:
    uses: khangvum/workflows/.github/workflows/dependency-audit.yml@main
    with:
      node-version: '24'
      audit-level: 'high'
